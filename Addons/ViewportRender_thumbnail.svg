<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Viewport Render &amp; Batch Camera</title>
  <desc id="desc">Three cameras with individual resolutions produce a batch of images. Workflow illustration.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#192f3d"/><stop offset="1" stop-color="#121020"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="36" y="43" fill="#9ac6d5" font-size="12" letter-spacing="3">BLENDER · RENDER WORKFLOW</text>
    <text x="36" y="86" fill="#f5f1ff" font-size="30" font-weight="700">Viewport Render</text>
    <text x="36" y="118" fill="#c4b9fa" font-size="24" font-weight="700">&amp; Batch Camera</text>
    <g fill="#152331" stroke="#365366">
      <rect x="36" y="155" width="156" height="111" rx="10"/>
      <rect x="208" y="155" width="156" height="111" rx="10"/>
      <rect x="380" y="155" width="224" height="111" rx="10"/>
    </g>
    <g fill="none" stroke="#9ac6d5" stroke-width="2">
      <rect x="58" y="174" width="112" height="59" rx="4"/>
      <rect x="267" y="169" width="38" height="68" rx="4"/>
      <rect x="402" y="174" width="180" height="59" rx="4"/>
      <path d="m97 219 17-29 17 29zm177 6 12-40 12 40zm193-7 25-28 25 28z" fill="#365366"/>
    </g>
    <g fill="#c0cfde" font-size="12" text-anchor="middle">
      <text x="114" y="253">FRONT · 1920 × 1080</text>
      <text x="286" y="253">SIDE · 1080 × 1920</text>
      <text x="492" y="253">DETAIL · 2560 × 1440</text>
    </g>
    <text x="36" y="314" fill="#b2a9c5" font-size="14">CAPTURE / RENDER</text>
    <text x="286" y="314" fill="#c4b9fa" font-size="23">→</text>
    <rect x="380" y="289" width="224" height="36" rx="8" fill="#243b48" stroke="#528198"/>
    <text x="492" y="312" fill="#f5f1ff" font-size="14" text-anchor="middle" font-weight="700">BATCH EXPORT · PNG / JPG</text>
  </g>
</svg>
