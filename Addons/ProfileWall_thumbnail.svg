<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Profile Wall Generator</title>
  <desc id="desc">Workflow illustration: combine a path and profile to generate a molding wall.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#203a3b"/><stop offset="1" stop-color="#121820"/></linearGradient></defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="36" y="43" fill="#9dd7cd" font-size="12" letter-spacing="3">BLENDER · PROCEDURAL MODELING</text>
    <text x="36" y="88" fill="#f1faf8" font-size="32" font-weight="700">Profile Wall Generator</text>
    <text x="36" y="116" fill="#b2c5c4" font-size="15">Path + Profile → Generated wall</text>
    <rect x="36" y="147" width="568" height="136" rx="12" fill="#142126" stroke="#426564"/>
    <g fill="none" stroke="#83c8ba" stroke-width="4" stroke-linejoin="round">
      <path d="M60 243L110 201L161 222L189 191"/>
      <path d="M251 246V238H264V227H257V198H264V185H251V176"/>
    </g>
    <g fill="#f1faf8" font-size="21"><text x="210" y="219">+</text><text x="306" y="219">→</text></g>
    <g stroke="#9dd7cd" stroke-linejoin="round">
      <path d="M364 213L462 158L571 190L571 253L462 220L364 270Z" fill="#35605f"/>
      <path d="M364 213L462 158L571 190L564 198L462 168L371 221Z" fill="#a2d5c4"/>
      <path d="M364 262L462 212L571 245V253L462 220L364 270Z" fill="#70a99b"/>
      <path d="M462 168V212" fill="none" stroke="#70a99b"/>
    </g>
    <g fill="#b2c5c4" font-size="12"><text x="78" y="269">PATH</text><text x="233" y="269">PROFILE</text></g>
    <text x="36" y="321" fill="#b2c5c4" font-size="14">CURVE / MESH</text>
    <rect x="333" y="298" width="271" height="34" rx="8" fill="#244039" stroke="#518f80"/>
    <text x="468" y="320" fill="#daf4ec" font-size="13" text-anchor="middle" font-weight="700">EDIT SOURCE → UPDATE WALL</text>
  </g>
</svg>
